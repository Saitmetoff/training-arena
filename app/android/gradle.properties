org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Flutter 3.47 + AGP 9 template compatibility flags (kept from the Flutter
# 3.47.5 app template; the old Groovy Android DSL relies on both being false).
android.newDsl=false
android.builtInKotlin=false
# Kotlin 2.4.0 / Gradle 9.3.1 on Windows: the Kotlin daemon fails to close its
# incremental caches ("Storage ... is already registered") and aborts plugin
# compilation. Compile in-process without incremental caches; builds stay
# deterministic at a small time cost. Re-test before removing either flag.
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
